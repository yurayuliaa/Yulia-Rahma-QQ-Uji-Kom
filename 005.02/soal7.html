<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal 2 - UI Button</title>
    <style>
        .btn-book {
            background-color: #2e3a9e; 
            color: white;              
            padding: 10px 50px;        
            font-size: 16px;           
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;         
            border: none;              
            border-radius: 8px;        
            cursor: pointer;           
            transition: background-color 0.3s ease; 
        }


        .btn-book:hover {
            background-color: #212972; 
        }
    </style>
</head>
<body>

    <button class="btn-book">Book Now</button>

</body>
</html>
