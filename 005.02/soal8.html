<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal 3 - UI Hero Image Text</title>
    <style>
        
        .hero-container {
            position: relative; 
            width: 100%;
            max-width: 800px;
        }

        .hero-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero-text {
            position: absolute; 
            top: 50%;           
            left: 20px;          
            transform: translateY(-50%); 
            color: #fff6f6;         
            font-size: 24px;
            font-family: 'Times New Roman', serif;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <img src="bali.jpg" alt="Pantai Bali" class="hero-image">
        <div class="hero-text">Welcome to bali</div>
    </div>

</body>
</html>
